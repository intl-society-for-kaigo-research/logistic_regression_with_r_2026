project:
  type: book
  output-dir: docs
  render:
    - event/index.qmd

resources:
  - data/KIHON.xlsx

book:
  title: "Logistic Regression with R"
  subtitle: "医療・福祉・スポーツ科学のための実践ガイド"
  author: "馬場美彦 (新潟医療福祉大学, 東京都介護福祉士会)"
  date: "2026-08-29"

  chapters:
    - index.qmd

    # Part 1: Foundations
    - part: "Part 1: Foundations"
      chapters:
        - book/intro.qmd
        - book/01_risk_ratio_and_odds_ratio.qmd
        - book/02_prevalence.qmd
        - book/03_logistic_regression.qmd
        - book/04_multiple_regression_vs_logistic_regression.qmd

    # Part 2: Model Building
    - part: "Part 2: Model Building"
      chapters:
        - book/05_variable_selection.qmd
        - book/06_sample_size.qmd
        - book/07_interaction.qmd
        - book/08_reporting_logistic_regression.qmd

    # Part 3: Practical Issues
    - part: "Part 3: Practical Issues"
      chapters:
        - book/09_missing_data_and_multiple_imputation.qmd
        - book/10_multinomial_logistic_regression.qmd
        - book/11_propensity_score.qmd

    # Part 4: Evaluation and Extensions
    - part: "Part 4: Evaluation and Extensions"
      chapters:
        - book/12_sensitivity_and_specificity.qmd
        - book/13_roc_curve.qmd
        - book/14_risk_score_development.qmd
        - book/15_machine_learning.qmd

    - book/summary.qmd
    - book/references.qmd

bibliography: references.bib

format:
  html:
    mathjax: true
    theme:
      - cosmo
      - brand

  pdf:
    pdf-engine: lualatex
    documentclass: ltjsarticle

editor: source